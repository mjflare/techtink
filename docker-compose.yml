# ==============================================================================
# TechTink Multi-Container Docker Compose Stack
# ==============================================================================
# Usage:
#   Start full stack:   docker compose up -d --build
#   Check logs:         docker compose logs -f
#   Stop stack:         docker compose down
#   App only:           docker compose up -d app
# ==============================================================================

version: '3.8'

services:
  # TechTink Application Server (Node 22 / Express / SQLite / React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techtink-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Persistent SQLite database storage on host
      - ./data:/app/data
    networks:
      - techtink-network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # High-Performance Nginx Reverse Proxy & Static Cache
  proxy:
    image: nginx:alpine
    container_name: techtink-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - techtink-network

networks:
  techtink-network:
    name: techtink-network
    driver: bridge
