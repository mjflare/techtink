[package]
name = "techtink-server"
version = "1.0.0"
edition = "2021"

[dependencies]
# Web framework & async runtime
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip", "compression-br"] }

# SQLite database layer
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Serialization & date/time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Security, hashing & auth
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"

# Outbound HTTP requests (Payment verification & webhooks)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Native SMTP server & outbound mail
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }

# VPS system resource metrics
sysinfo = "0.31"

# Utilities & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
